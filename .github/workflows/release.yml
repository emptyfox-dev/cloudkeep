name: release

# 多系统二进制构建。
#
# 为什么需要这份工作流：CNB 只能运行 Linux 容器，无法产出 macOS 二进制
# （交叉编译需要 Apple SDK），FreeBSD 也需要自建 sysroot。因此分工是：
#   - CNB（.cnb.yml）：Linux amd64/arm64 + Windows amd64（mingw 交叉编译）
#   - 本工作流：macOS（Intel + Apple Silicon）+ FreeBSD，并在最后把产物
#     发布到**同一个 CNB Release**，让多系统产物集中在一处
#
# 需要的仓库 Secret：
#   CNB_TOKEN  具备 repo-release:rw 权限的 CNB 令牌
# 未配置时发布步骤自动跳过，构建本身照常完成。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------
  # macOS：必须在 macOS runner 上构建
  # ---------------------------------------------------------------
  macos:
    name: macos-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-13
            target: x86_64-apple-darwin
          - arch: arm64
            runner: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 构建
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 验证可运行
        run: |
          ./target/${{ matrix.target }}/release/cloudkeep --version
          ./target/${{ matrix.target }}/release/cloudkeep help > /dev/null

      - name: 整理产物
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/cloudkeep \
             dist/cloudkeep-macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: cloudkeep-macos-${{ matrix.arch }}
          path: dist/cloudkeep-macos-${{ matrix.arch }}
          if-no-files-found: error

  # ---------------------------------------------------------------
  # FreeBSD：没有官方 hosted runner，用虚拟机
  # ---------------------------------------------------------------
  freebsd:
    name: freebsd-amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 在 FreeBSD 中构建
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            cargo build --release --locked
            ./target/release/cloudkeep --version
            ./target/release/cloudkeep help > /dev/null
            mkdir -p dist
            cp target/release/cloudkeep dist/cloudkeep-freebsd-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: cloudkeep-freebsd-amd64
          path: dist/cloudkeep-freebsd-amd64
          if-no-files-found: error

  # ---------------------------------------------------------------
  # 汇总并发布到 CNB Release，与 CNB 自己产出的 Linux / Windows 合并到同一版本
  # ---------------------------------------------------------------
  publish:
    name: publish-to-cnb-release
    runs-on: ubuntu-latest
    needs: [macos, freebsd]
    if: always() && needs.macos.result != 'cancelled' && needs.freebsd.result != 'cancelled'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 列出待发布产物
        run: ls -lh dist/

      - name: 发布到 CNB Release
        env:
          TOKEN: ${{ secrets.CNB_TOKEN }}
          CNB_REPO: Emptyfox-Network/CloudKeep
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -e
          if [ -z "$TOKEN" ]; then
            echo "未配置 CNB_TOKEN，跳过发布（产物仍可从本工作流 Artifacts 下载）"
            exit 0
          fi
          sh scripts/publish-release.sh dist
